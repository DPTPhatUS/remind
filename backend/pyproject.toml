[project]
name = "remind-backend"
version = "0.1.0"
description = "Desktop backend for a real-time memory reminder assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "pgvector>=0.3.2",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "ruff>=0.6.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "uvicorn[standard]>=0.30.0",
    "webrtcvad-wheels>=2.0.14",
    "mypy>=1.11.0",
    "psycopg2-binary>=2.9.9",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = false

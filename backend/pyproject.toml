[project]
name = "remind-backend"
version = "0.1.0"
description = "Desktop backend for a real-time memory reminder assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "openai>=1.50.0",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.30.0",
    "webrtcvad-wheels>=2.0.14",
    "aiosqlite>=0.22.1",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "av>=19.0.1",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.optional-dependencies]
speaker = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "speechbrain==1.1.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["remind*"]

[tool.setuptools.package-data]
remind = ["assets/*.json", "assets/licenses/*.txt"]

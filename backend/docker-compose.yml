services:
  # The project uses the host's existing Postgres 17 (with the pgvector
  # extension installed) on localhost:5432, so this compose file only stands
  # up the CompreFace face-recognition stack. To bootstrap the database:
  #   PGPASSWORD=remind psql -h localhost -U remind -d remind \
  #     -c "CREATE EXTENSION IF NOT EXISTS vector;"
  #   uv run alembic upgrade head

  compreface-postgres-db:
    image: exadel/compreface-postgres-db:1.2.0
    environment:
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: compreface
      POSTGRES_DB: compreface
    volumes:
      - compreface-postgres:/var/lib/postgresql/data

  compreface-core:
    image: exadel/compreface-core:1.2.0
    environment:
      ML_PORT: 3000
      IMG_LENGTH_LIMIT: 640

  compreface-api:
    image: exadel/compreface-api:1.2.0
    depends_on:
      - compreface-postgres-db
      - compreface-core
    environment:
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: compreface
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/compreface
      SPRING_PROFILES_ACTIVE: dev
      SAVE_IMAGES_TO_DB: "false"
      MAX_FILE_SIZE: 5MB
      MAX_REQUEST_SIZE: 5MB

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    depends_on:
      - compreface-postgres-db
      - compreface-api
    environment:
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: compreface
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/compreface
      SPRING_PROFILES_ACTIVE: dev
      ENABLE_EMAIL_SERVER: "false"

  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    depends_on:
      - compreface-api
      - compreface-admin
    environment:
      CLIENT_MAX_BODY_SIZE: 5m
      PROXY_READ_TIMEOUT: 300s
      PROXY_CONNECT_TIMEOUT: 75s
    ports:
      - "8000:80"

volumes:
  compreface-postgres:

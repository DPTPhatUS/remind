services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: remind
      POSTGRES_PASSWORD: remind
      POSTGRES_DB: remind
    ports:
      - "5432:5432"
    volumes:
      - remind-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remind -d remind"]
      interval: 5s
      timeout: 3s
      retries: 20

  compreface-postgres-db:
    image: exadel/compreface-postgres-db:1.2.0
    environment:
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: compreface
      POSTGRES_DB: compreface
    volumes:
      - compreface-postgres:/var/lib/postgresql/data

  compreface-core:
    image: exadel/compreface-core:1.2.0
    environment:
      ML_PORT: 3000
      IMG_LENGTH_LIMIT: 640

  compreface-api:
    image: exadel/compreface-api:1.2.0
    depends_on:
      - compreface-postgres-db
      - compreface-core
    environment:
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: compreface
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/compreface
      SPRING_PROFILES_ACTIVE: dev
      SAVE_IMAGES_TO_DB: "false"
      MAX_FILE_SIZE: 5MB
      MAX_REQUEST_SIZE: 5MB

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    depends_on:
      - compreface-postgres-db
      - compreface-api
    environment:
      POSTGRES_USER: compreface
      POSTGRES_PASSWORD: compreface
      POSTGRES_URL: jdbc:postgresql://compreface-postgres-db:5432/compreface
      SPRING_PROFILES_ACTIVE: dev
      ENABLE_EMAIL_SERVER: "false"

  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    depends_on:
      - compreface-api
      - compreface-admin
    ports:
      - "8000:80"

volumes:
  remind-postgres:
  compreface-postgres:
